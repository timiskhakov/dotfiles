set -g mouse on
set -g status-right ""
set -g focus-events on

unbind -T root WheelUpStatus
unbind -T root WheelDownStatus

# Kanagawa Wave colors for Tmux
set -g mode-style "fg=#7e9cd8,bg=#2d4f67"
set -g message-style "fg=#7e9cd8,bg=#2d4f67"
set -g message-command-style "fg=#7e9cd8,bg=#2d4f67"
set -g pane-border-style "fg=#2d4f67"
set -g pane-active-border-style "fg=#7e9cd8"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#7e9cd8,bg=#1f1f28"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=#16161d,bg=#7e9cd8,bold] #S #[fg=#7e9cd8,bg=#1f1f28,nobold,nounderscore,noitalics]"
setw -g window-status-activity-style "underscore,fg=#c8c093,bg=#1f1f28"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#c8c093,bg=#1f1f28"
setw -g window-status-format "#[fg=#1f1f28,bg=#1f1f28,nobold,nounderscore,noitalics]#[default] [#I] #W #[fg=#1f1f28,bg=#1f1f28,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#1f1f28,bg=#2d4f67,nobold,nounderscore,noitalics]#[fg=#7e9cd8,bg=#2d4f67,bold] [#I] #W #[fg=#2d4f67,bg=#1f1f28,nobold,nounderscore,noitalics]"
set -g @prefix_highlight_output_prefix "#[fg=#e6c384]#[bg=#1f1f28]#[fg=#1f1f28]#[bg=#e6c384]"
set -g @prefix_highlight_output_suffix ""

